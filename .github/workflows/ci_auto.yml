name: aa_auto

# Required repository secret:
#   BRIGHT_DATA_API_KEY - Bright Data API key with Google AI Mode access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads_googleai
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  WORKDIR: uinterface/zernio

jobs:
  # secret-scan:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: harshahemanth/secret-scan@v1
  #       with:
  #         path: ${{ env.WORKDIR }}

  google-ai-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install fire requests

      - name: Run random Google AI Mode query
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
        run: |
          test -n "$BRIGHT_DATA_API_KEY"
          python zerno/run.py search_googleai_v1

      - name: Upload Google AI response
        uses: actions/upload-artifact@v4
        with:
          name: google-ai-mode-${{ github.run_id }}
          path: zout/**/*.json
          if-no-files-found: error
          retention-days: 7
