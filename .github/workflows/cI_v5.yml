name: aa_auto_v4



on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  
permissions:
  contents: read

concurrency:
  group: ads_googleai
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  WORKDIR: .

jobs:
  # secret-scan:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: harshahemanth/secret-scan@v1
  #       with:
  #         path: ${{ env.WORKDIR }}

  google-ai-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
         ref: 'dev'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install fire requests

      - name: Run v1
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_API_KEY2: ${{ secrets.BRIGHT_DATA_API_KEY2 }}
        run: |
          test -n "$BRIGHT_DATA_API_KEY"
          test -n "$BRIGHT_DATA_API_KEY2"
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_chatgpt_v1
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1

      - name: Run v2
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_API_KEY2: ${{ secrets.BRIGHT_DATA_API_KEY2 }}
        run: |
          test -n "$BRIGHT_DATA_API_KEY"
          test -n "$BRIGHT_DATA_API_KEY2"
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1


      - name: Run v3
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_API_KEY2: ${{ secrets.BRIGHT_DATA_API_KEY2 }}
        run: |
          test -n "$BRIGHT_DATA_API_KEY"
          test -n "$BRIGHT_DATA_API_KEY2"
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1


      - name: Run v4
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_API_KEY2: ${{ secrets.BRIGHT_DATA_API_KEY2 }}
        run: |
          test -n "$BRIGHT_DATA_API_KEY"
          test -n "$BRIGHT_DATA_API_KEY2"
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1
          

      - name: Run v6
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_API_KEY2: ${{ secrets.BRIGHT_DATA_API_KEY2 }}
        run: |
          test -n "$BRIGHT_DATA_API_KEY"
          test -n "$BRIGHT_DATA_API_KEY2"
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1
          python zerno/run.py search_googleai_v1
          
