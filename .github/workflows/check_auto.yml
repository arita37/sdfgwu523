name: Daily Google AI citation ranking

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-ai-ranking-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check-ranking:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install fire requests

      - name: Check five unbranded queries
        timeout-minutes: 17
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_API_KEY2: ${{ secrets.BRIGHT_DATA_API_KEY2 }}
        run: python zerno/check.py --rank_path=zerno/ranking/rank.tsv

      - name: Preserve ranking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ai-ranking-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            zerno/ranking/rank.tsv
            zerno/ranking/raw/
          retention-days: 30

      - name: Commit completed ranking rows
        if: always()
        timeout-minutes: 5
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- zerno/ranking/rank.tsv
          if git diff --cached --quiet; then
            echo "No new ranking rows to commit"
            exit 0
          fi
          git commit -m "data(seo): daily citation rankings run=${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_REF" || exit 1
            if git push origin "HEAD:refs/heads/$TARGET_REF"; then
              echo "Ranking TSV committed and pushed to $TARGET_REF"
              exit 0
            fi
            sleep 3
          done
          echo "Failed to push ranking TSV to $TARGET_REF; recover it from the run artifact" >&2
          exit 1
