name: Submit URLs to IndexJump

# Required repository secret:
#   INDEXJUMP_TOKEN - IndexJump API token

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexjump-url-submit
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install fire requests

      - name: Submit pending URLs
        env:
          INDEXJUMP_TOKEN: ${{ secrets.INDEXJUMP_TOKEN }}
        run: |
          test -n "$INDEXJUMP_TOKEN"
          python zerno/run.py index_url_submit

      - name: Commit submission state
        env:
          TARGET_REF: dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- urls.md urls_done.md
          if git diff --cached --quiet; then
            echo "No URL submission state changes to commit"
            exit 0
          fi
          git commit -m "data(indexjump): update submitted URLs run=${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            if git pull --rebase origin "$TARGET_REF" &&
              git push origin "HEAD:$TARGET_REF"; then
              exit 0
            fi
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push URL submission state after 5 attempts" >&2
          exit 1
